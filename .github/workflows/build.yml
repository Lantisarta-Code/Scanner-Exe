name: Build EasyCentralBot.exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Windows compiler (MinGW-w64)
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix \
            g++-mingw-w64-i686-posix gcc-mingw-w64-i686-posix g++-mingw-w64-x86-64-win32 gcc-mingw-w64-x86-64-win32 \
            g++-mingw-w64-i686-win32 gcc-mingw-w64-i686-win32 binutils-mingw-w64

      # The files may have been uploaded with or without their folders: put them all in one place.
      - name: Collect the source files
        run: |
          mkdir -p b
          find . -path ./b -prune -o -path ./.git -prune -o -type f \( -name '*.cpp' -o -name '*.c' -o -name '*.h' \
               -o -name '*.hpp' -o -name '*.rc' -o -name '*.manifest' -o -name '*.ico' \) -print -exec cp {} b/ \;
          rm -f b/cli_main.cpp
          ls b

      # Builds 64-bit and 32-bit. Every .exe is checked for Windows functions that Windows 7 does not have;
      # if the first compiler variant uses one, the other variant is tried.
      - name: Build (Windows 7 - 11)
        run: |
          cd b
          NOT_ON_WIN7='GetSystemTimePreciseAsFileTime|WaitOnAddress|WakeByAddress|SetThreadDescription|GetCurrentPackage|CreateFile2|api-ms-win-|ucrtbase'
          build() {   # build <arch> <variant>
            P=$1-w64-mingw32
            $P-windres app.rc -O coff -o res.o
            for c in miniz miniz_tdef miniz_tinfl miniz_zip; do $P-gcc-$2 -O2 -D_WIN32_WINNT=0x0601 -I. -c $c.c -o $c.o; done
            $P-g++-$2 -std=c++17 -O2 -municode -mwindows -static -static-libgcc -static-libstdc++ \
              -D_WIN32_WINNT=0x0601 -DWINVER=0x0601 -I. \
              common.cpp net.cpp webdriver.cpp scanner.cpp splitter.cpp drivers.cpp crypto.cpp remote.cpp core.cpp gui_win.cpp \
              miniz.o miniz_tdef.o miniz_tinfl.o miniz_zip.o res.o -o out.exe \
              -lws2_32 -lwinhttp -lcomctl32 -lcomdlg32 -lgdi32 -ladvapi32 -lshell32 -luser32 -lkernel32 || return 1
            $P-strip out.exe
            echo "--- $1 $2: DLLs used"
            $P-objdump -p out.exe | grep "DLL Name"
            if $P-objdump -p out.exe | grep -E "$NOT_ON_WIN7"; then echo "uses a function Windows 7 does not have"; return 1; fi
            return 0
          }
          for arch in x86_64 i686; do
            if build $arch posix || build $arch win32; then
              mv out.exe ../EasyCentralBot_$arch.exe
            else
              echo "No Windows 7 compatible build for $arch"; exit 1
            fi
          done
          cd ..
          mv EasyCentralBot_x86_64.exe EasyCentralBot.exe
          mv EasyCentralBot_i686.exe EasyCentralBot-32bit.exe
          ls -la *.exe

      - uses: actions/upload-artifact@v4
        with:
          name: EasyCentralBot
          path: |
            EasyCentralBot.exe
            EasyCentralBot-32bit.exe

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: EasyCentral Bot v${{ github.run_number }}
          files: |
            EasyCentralBot.exe
            EasyCentralBot-32bit.exe
